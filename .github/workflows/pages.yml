name: Site público (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "GATEWAY_PC/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes do gateway e do site
        working-directory: GATEWAY_PC
        run: python -m unittest discover -s tests -v
      - name: Testes do núcleo do espectador
        run: node --test site/tests/sync-core.test.js
      - name: Teste ponta a ponta (Firebase de teste, 4 espectadores)
        working-directory: GATEWAY_PC
        run: python tests/e2e_online.py
      - name: Montar o site
        env:
          # Variável do repositório (Settings > Secrets and variables > Actions > Variables).
          # Valor público: endereço do Realtime Database. Sem ela, usa o padrão do build.
          FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
        run: python site/build.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: test-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
